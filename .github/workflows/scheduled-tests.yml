name: Tests Planifiés

on:
  # 1. Déclenchement planifié (Cron UTC)
  schedule:
    # Exécution du lundi au vendredi à 06:00 UTC (ex: 07:00 ou 08:00 heure française)
    - cron: '30 23 * * 1-6'

  # 2. Permet aussi de déclencher le workflow manuellement depuis l'interface GitHub
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Installer les dépendances
        run: npm ci

      - name: Installer les navigateurs Playwright
        run: npx playwright install --with-deps

      - name: Exécuter la suite de tests
        run: npx playwright test

      - name: Sauvegarder le rapport de test
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
