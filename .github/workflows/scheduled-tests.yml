name: Tests Planifiés

on:
  # 1. Déclenchement planifié (Cron UTC)
  #schedule:
    # Exécution du lundi au vendredi à 06:00 UTC (ex: 07:00 ou 08:00 heure française)
    #- cron: '33 3 * * 1-6'

  # 2. Permet aussi de déclencher le workflow manuellement depuis l'interface GitHub
  workflow_dispatch:
    inputs:
      test_file:
        description: 'Fichier de test à exécuter'
        type: choice
        required: true
        default: all
        options:
          - all
          - e2e/saq.spec.js
          - e2e/saq_bis.spec.js
      target:
        description: 'Environnement à tester'
        type: choice
        required: true
        default: both
        options:
          - both
          - desktop
          - mobile

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Installer les dépendances
        run: npm ci

      - name: Installer les navigateurs Playwright
        run: npx playwright install --with-deps chromium

      - name: Exécuter la suite de tests
        env:
          TEST_FILE: ${{ inputs.test_file || 'all' }}
          TARGET: ${{ inputs.target || 'both' }}
        run: |
          args=()
          if [[ "$TEST_FILE" != "all" ]]; then
            args+=("$TEST_FILE")
          fi

          case "$TARGET" in
            desktop) args+=(--project=chromium) ;;
            mobile) args+=(--project="Mobile Chrome") ;;
          esac

          npx playwright test "${args[@]}"

      - name: Sauvegarder le rapport de test
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reporting-labs
          path: reporting-labs/
          retention-days: 30
